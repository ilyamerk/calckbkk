<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Калькулятор зарплаты</title>
  <meta name="description" content="Расчёт зарплаты за смену и премии за месяц по должности." />
  <meta name="theme-color" content="#E7E7E2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151613" media="(prefers-color-scheme: dark)" />

  <link rel="preload" href="fonts/golos-text-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />

  <style>

    @font-face{font-family:"Golos Text";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/golos-text-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

    @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

    @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

    :root{
      --page:#E7E7E2;
      --panel:#F6F6F2;
      --field:#FFFFFF;
      --ink:#1C1D1A;
      --muted:#696B64;
      --rule:#D4D5CE;
      --rule-strong:#B9BBB2;
      --accent:#5B3B27;
      --accent-ink:#FFFFFF;
      --paper:#FFFFFF;
      --paper-ink:#232320;
      --paper-muted:#7A7A73;
      --danger:#B3261E;
      --danger-bg:#FBEDEB;
      --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      --r:6px;
      --h:44px;
      color-scheme:light;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --page:#151613; --panel:#1D1E1B; --field:#24251F; --ink:#ECECE6; --muted:#9C9E95;
        --rule:#33352F; --rule-strong:#4A4C44; --accent:#D2A27C; --accent-ink:#1A1410;
        --paper:#F1EFE8; --paper-ink:#232320; --paper-muted:#7A7A73;
        --danger:#F08A80; --danger-bg:#3A201D;
        color-scheme:dark;
      }
    }

    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100dvh;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    h1,h2,h3,p{margin:0}

    .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

    /* ===== Шапка ===== */
    .top{padding:28px 0 22px}
    .top h1{font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
    .top p{color:var(--muted);margin-top:6px;max-width:560px}

    /* ===== Должности ===== */
    .roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:20px}
    @media (max-width:860px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .role{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;min-height:68px;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);transition:border-color .12s,background .12s}
    .role:hover{border-color:var(--rule-strong)}
    .role b{font-weight:600;font-size:15px;line-height:1.3}
    .role span{font-size:13px;color:var(--muted);line-height:1.3}
    .role[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
    .role[aria-checked="true"] span{color:color-mix(in srgb,var(--page) 70%,var(--ink))}

    /* ===== Сетка ===== */
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start;padding-bottom:64px}
    @media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr);padding-bottom:110px}}

    /* ===== Форма ===== */
    .panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r)}
    .form{padding:4px 24px 24px}
    @media (max-width:560px){.form{padding:2px 16px 18px}}
    .intro{padding:40px 24px;color:var(--muted);text-align:center}
    .group{padding-top:20px}
    .group h2{font-size:13px;font-weight:600;color:var(--muted);padding-bottom:8px}

    .row{display:grid;grid-template-columns:minmax(0,1fr) 260px;column-gap:28px;padding:12px 0;border-top:1px solid var(--rule)}
    .row[hidden]{display:none}
    .row-label{padding-top:11px;min-width:0}
    .row-label label,.row-label .lbl{font-weight:500;line-height:1.35}
    .q{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;vertical-align:1px;border:1px solid var(--rule-strong);border-radius:50%;background:transparent;color:var(--muted);font-size:11px;font-weight:600;line-height:1;padding:0}
    .q:hover,.q[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
    .nw{white-space:nowrap}
    .hint{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.45;padding-left:10px;border-left:2px solid var(--rule-strong)}
    .hint[hidden]{display:none}
    .row-ctrl{min-width:0}
    .err{display:none;margin-top:6px;color:var(--danger);font-size:13px;font-weight:500}
    .row.invalid .err{display:block}
    @media (max-width:640px){
      .row{grid-template-columns:minmax(0,1fr);row-gap:10px}
      .row-label{padding-top:0}
    }

    /* поле с единицей */
    .num{position:relative}
    .num input{width:100%;height:var(--h);padding:0 52px 0 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--field);font-family:var(--mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
    .num input::placeholder{color:var(--muted);opacity:.5}
    .num input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
    .num .u{position:absolute;right:0;top:0;bottom:0;width:44px;display:grid;place-items:center;border-left:1px solid var(--rule);color:var(--muted);font-size:13px;pointer-events:none}
    .row.invalid .num input,.row.invalid .stepper,.row.invalid .seg{border-color:var(--danger);background:var(--danger-bg)}

    /* степпер */
    .stepper{display:grid;grid-template-columns:var(--h) minmax(0,1fr) var(--h);height:var(--h);border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--field);overflow:hidden}
    .stepper:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
    .stepper button{border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink)}
    .stepper button:first-child{border-right:1px solid var(--rule)}
    .stepper button:last-child{border-left:1px solid var(--rule)}
    .stepper button:hover{background:var(--panel)}
    .stepper button:active{background:var(--rule)}
    .sv{display:flex;align-items:center;justify-content:center;gap:6px;cursor:text}
    .sv input{width:3ch;min-width:2ch;max-width:100%;border:0;background:transparent;padding:0;font-family:var(--mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
    .sv input:focus{outline:none}
    .sv input::placeholder{color:var(--muted);opacity:.5}
    .sv .u{color:var(--muted);font-size:13px}
    .presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
    .presets button{height:30px;border:1px solid var(--rule);border-radius:var(--r);background:transparent;font-family:var(--mono);font-size:13px;color:var(--muted)}
    .presets button:hover{border-color:var(--rule-strong);color:var(--ink)}
    .presets button.on{background:var(--ink);border-color:var(--ink);color:var(--page)}

    /* да / нет */
    .seg{display:grid;grid-template-columns:1fr 1fr;height:var(--h);border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--field);overflow:hidden}
    .seg button{border:0;background:transparent;font-weight:500;font-size:14px;color:var(--muted)}
    .seg button+button{border-left:1px solid var(--rule)}
    .seg button:hover{color:var(--ink)}
    .seg button[aria-checked="true"]{background:var(--ink);color:var(--page)}

    /* кнопки */
    .actions{display:flex;gap:8px;margin-top:20px;padding-top:20px;border-top:1px solid var(--rule)}
    .btn{height:48px;padding:0 20px;border:1px solid transparent;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px}
    .btn:hover{filter:brightness(1.08)}
    .btn:active{transform:translateY(1px)}
    .btn.main{flex:1}
    .btn.plain{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
    .btn.plain:hover{filter:none;background:var(--page)}

    /* ===== Чек ===== */
    .side{position:sticky;top:20px}
    @media (max-width:960px){.side{position:static}}
    .receipt-wrap{filter:drop-shadow(0 1px 1px rgba(0,0,0,.08)) drop-shadow(0 6px 14px rgba(0,0,0,.08));padding-bottom:10px}
    .receipt{position:relative;background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:13px;line-height:1.5;padding:22px 20px 14px}
    .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
      background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/10px 10px repeat-x,
                 linear-gradient(-135deg,var(--paper) 50%,transparent 50%) 0 0/10px 10px repeat-x}
    .receipt.print{animation:print .7s cubic-bezier(.2,.7,.2,1) both}
    @keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -12px 0)}}
    .rc-c{text-align:center}
    .rc-title{font-weight:600;letter-spacing:.08em}
    .rc-m{color:var(--paper-muted)}
    .rc-cut{border:0;border-top:1px dashed #A9A9A2;margin:12px 0}
    .rc-dbl{border:0;border-top:3px double var(--paper-ink);margin:12px 0}
    .rc-sec{font-weight:600;margin-bottom:2px}
    .rc-row{display:flex;align-items:baseline;gap:6px}
    .rc-row .l{flex:0 1 auto}
    .rc-row .d{flex:1;border-bottom:1px dotted #B4B4AD;transform:translateY(-4px);min-width:12px}
    .rc-row .v{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
    .rc-row.b .l,.rc-row.b .v{font-weight:600}
    .rc-note{color:var(--paper-muted);font-size:12px;padding-left:12px;margin-bottom:4px}
    .rc-total{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:600;text-align:right}
    .rc-total .rc-m{font-weight:400;font-size:12px}
    .rc-total .v{font-size:26px;letter-spacing:-.02em;white-space:nowrap}
    .rc-empty{padding:24px 0 18px;color:var(--paper-muted)}
    .rc-err{color:#B3261E;font-weight:600}
    .side-actions{margin-top:16px}
    .side-actions .btn{width:100%}
    .side-note{margin-top:12px;font-size:12.5px;color:var(--muted)}

    /* ===== Мобильная панель ===== */
    .mbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--rule);display:none}
    .mbar .btn{width:100%}
    @media (max-width:960px){.mbar.show{display:block}}

    .toast{position:fixed;left:50%;bottom:24px;z-index:30;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--page);padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:500;transition:opacity .15s,transform .15s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:960px){.toast{bottom:84px}}

    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Калькулятор зарплаты</h1>
      <p>Выбери должность и заполни показатели — расчёт появится в чеке.</p>
    </header>

    <div class="roles" role="radiogroup" aria-label="Должность" id="roles">
      <button type="button" class="role" role="radio" aria-checked="false" data-role="zam"><b>Заместитель директора</b><span>премия за месяц</span></button>
      <button type="button" class="role" role="radio" aria-checked="false" data-role="povar"><b>Повар</b><span>зарплата за смену</span></button>
      <button type="button" class="role" role="radio" aria-checked="false" data-role="others"><b>Кассир, бариста, зал</b><span>а также ст. кассир и повар-универсал</span></button>
      <button type="button" class="role" role="radio" aria-checked="false" data-role="general"><b>Общий подсчёт</b><span>по ставке на месяц</span></button>
    </div>

    <div class="layout">
      <main class="panel" id="panel">
        <p class="intro" id="intro">Сначала выбери должность выше.</p>
        <div id="formWrap" hidden>
          <form class="form" id="form" novalidate autocomplete="off"></form>
          <div class="form" style="padding-top:0">
            <div class="actions" style="margin-top:0">
              <button type="button" class="btn main" id="calcBtn">Рассчитать</button>
              <button type="button" class="btn plain" id="resetBtn">Очистить</button>
            </div>
          </div>
        </div>
      </main>

      <aside class="side" id="side" aria-live="polite">
        <div class="receipt-wrap"><div class="receipt" id="receipt"></div></div>
        <div class="side-actions" id="sideActions" hidden><button type="button" class="btn plain" id="copyBtn">Скопировать расчёт</button></div>
        <p class="side-note">Расчёт предварительный. Точную сумму уточняй у директора.</p>
      </aside>
    </div>
  </div>

  <div class="mbar" id="mbar"><button type="button" class="btn" id="calcBtnM">Рассчитать</button></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
  (function(){
    'use strict';

    const DIR = ' Эту информацию ты можешь уточнить у своего директора.';
    const ROLES = {
      zam: {
        name: 'Заместитель директора',
        title: 'Показатели за месяц',
        groups: [{ title: null, fields: [
          { id:'zam_to', type:'num', unit:'%', label:'На сколько процентов выполнен план по ТО за месяц?', copy:'Процент выполнения плана по ТО (%)',
            hint:'Процент выполнения плана по товарообороту за месяц. Например, если план был 100 000 ₽, а лавка заработала 95 000 ₽, введи 95.' },
          { id:'zam_tp', type:'num', unit:'%', label:'На сколько процентов пройдена проверка Тайного покупателя?', copy:'Процент проверки Тайного покупателя (%)',

      others: {

          { title:'Качество', fields: [

            { id:'others_tp', type:'num', unit:'%', dep:'others_has_tp', label:'На сколько процентов пройдена проверка?', copy:'Процент проверки Тайного покупателя (%)',
              hint:'Оценка качества обслуживания, которую ставит тайный покупатель. Укажи процент прохождения чек-листа.' + DIR },
            { id:'others_has_ato', type:'yn', label:'Было прохождение АТО+СГИ?', copy:'Было ли прохождение АТО + СГИ?', hint:'Проводилась ли проверка АТО+СГИ во время твоей смены.' },
            { id:'others_ato', type:'num', unit:'%', dep:'others_has_ato', label:'Процент прохождения АТО+СГИ за смену', copy:'Процент прохождения АТО+СГИ (%)',
              hint:'АТО+СГИ — показатели аудита торговой точки и соблюдения санитарных норм. Укажи процент выполнения этих стандартов за смену.' + DIR },
            { id:'others_complaints', type:'num', unit:'шт', label:'Подтверждённых отрицательных отзывов за смену', copy:'Подтверждённые отрицательные отзывы', full:true,
              hint:'Количество подтверждённых жалоб от клиентов за смену.' + DIR }

      },
      general: {
        name: 'Общий подсчёт',
        title: 'План на месяц',
        groups: [{ title:null, fields: [
          { id:'general_rate', type:'num', unit:'₽/ч', label:'Твоя часовая ставка', copy:'Часовая ставка (₽)', full:true, hint:'Сумма за час без премий.' },
          { id:'general_shifts', type:'step', unit:'дн', min:1, max:31, inc:1, int:true, presets:[15,20,22,26], label:'Сколько дней в месяце планируешь работать?', copy:'Количество дней в месяце', hint:'От 1 до 31 дня.' },
          { id:'general_hours', type:'step', unit:'ч', min:0.5, max:24, inc:0.5, presets:[6,8,11,12], label:'По сколько часов в день?', copy:'Часов в день', hours:true, hint:'От 0,5 до 24 часов с шагом 0,5.' }
        ]}]
      }
    };


    /* ================= УТИЛИТЫ ================= */
    const $ = (s, r=document) => r.querySelector(s);
    const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const parseNum = v => { const s = String(v ?? '').replace(/\s/g,'').replace(',', '.'); return s === '' ? NaN : Number(s); };
    const fmtNum = (n, d=0) => n.toLocaleString('ru-RU', { minimumFractionDigits:d, maximumFractionDigits:d });
    const rub = n => fmtNum(Math.round(n)) + ' ₽';
    const rubH = n => fmtNum(Math.round(n)) + ' ₽/час';
    const h1 = n => fmtNum(n, 1) + ' ч';
    const pct = n => fmtNum(n, n % 1 ? 1 : 0) + '%';

    let state = { role:null, values:{}, last:null };

    /* ================= ФОРМА ================= */
    function ctrlHTML(f){
      if (f.type === 'yn') return `<div class="seg" role="radiogroup" aria-labelledby="${f.id}_lbl" data-yn="${f.id}">
          <button type="button" role="radio" aria-checked="false" data-v="yes">Да</button><button type="button" role="radio" aria-checked="false" data-v="no">Нет / не знаю</button></div>`;
      if (f.type === 'step') return `<div class="stepper">
          <button type="button" data-inc="-1" aria-label="Меньше">−</button>
          <label class="sv"><input id="${f.id}" inputmode="decimal" placeholder="${fmtNum(f.presets[1])}"><span class="u">${f.unit}</span></label>
          <button type="button" data-inc="1" aria-label="Больше">+</button></div>
        <div class="presets">${f.presets.map(p => `<button type="button" data-preset="${p}">${fmtNum(p)}</button>`).join('')}</div>`;
      return `<div class="num"><input id="${f.id}" inputmode="decimal" placeholder="0"><span class="u">${f.unit}</span></div>`;
    }
    function rowHTML(f){
      // последнее слово + «?» склеены, чтобы значок не уезжал на отдельную строку
      const q = f.hint ? `<button type="button" class="q" aria-expanded="false" aria-controls="${f.id}_hint" aria-label="Подсказка">?</button>` : '';
      const words = f.label.split(' '), last = words.pop();
      const text = `${esc(words.join(' '))} <span class="nw">${esc(last)}${q}</span>`;
      const lbl = f.type === 'yn' ? `<span class="lbl" id="${f.id}_lbl">${text}</span>` : `<label for="${f.id}">${text}</label>`;
      const hint = f.hint ? `<p class="hint" id="${f.id}_hint" hidden>${esc(f.hint)}</p>` : '';
      return `<div class="row" data-id="${f.id}"${f.dep ? ' hidden' : ''}>
        <div class="row-label">${lbl}${hint}</div>
        <div class="row-ctrl">${ctrlHTML(f)}<p class="err"></p></div></div>`;
    }
    function renderForm(role){
      $('#form').innerHTML = ROLES[role].groups.map(g =>
        `<section class="group"><h2>${esc(g.title || ROLES[role].title)}</h2>${g.fields.map(rowHTML).join('')}</section>`).join('');
      $('#intro').hidden = true; $('#formWrap').hidden = false;
      $$('.sv input').forEach(fitInput);
    }

    const fieldsOf = role => ROLES[role].groups.flatMap(g => g.fields);
    const fieldDef = id => fieldsOf(state.role).find(f => f.id === id);

    function fitInput(inp){ const n = (inp.value || inp.placeholder || '').length; inp.style.width = Math.max(2, n + .5) + 'ch'; }

    function selectRole(role, force){
      if (state.role === role && !force) return;
      state = { role, values:{}, last:null };
      $$('.role').forEach(b => b.setAttribute('aria-checked', String(b.dataset.role === role)));
      renderForm(role);
      showEmpty();
      updateBar();
    }

    function setYN(id, v){
      state.values[id] = v;
      $$(`[data-yn="${id}"] button`).forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === v)));
      clearErr(id);
      fieldsOf(state.role).filter(f => f.dep === id).forEach(f => {
        const row = $(`.row[data-id="${f.id}"]`);
        row.hidden = v !== 'yes';
        if (v !== 'yes'){ $('#'+f.id).value = ''; clearErr(f.id); }
      });
    }
    function setStepVal(id, v){ const inp = $('#'+id); inp.value = String(v).replace('.', ','); fitInput(inp); syncPresets(id); clearErr(id); }
    function stepValue(id, dir){
      const f = fieldDef(id);
      let v = parseNum($('#'+id).value);
      if (isNaN(v)) v = f.presets[1] - dir * f.inc;
      v = Math.min(f.max, Math.max(f.min, Math.round((v + dir * f.inc) / f.inc) * f.inc));
      setStepVal(id, v);
    }
    function syncPresets(id){ const v = parseNum($('#'+id).value); $$(`.row[data-id="${id}"] .presets button`).forEach(b => b.classList.toggle('on', Number(b.dataset.preset) === v)); }
    function clearErr(id){ const r = $(`.row[data-id="${id}"]`); if (r) r.classList.remove('invalid'); }
    function setErr(id, msg){ const r = $(`.row[data-id="${id}"]`); if (!r) return; r.classList.add('invalid'); $('.err', r).textContent = msg; }

    /* ================= ВАЛИДАЦИЯ ================= */
    function collect(){
      const out = {}, errors = [];
      fieldsOf(state.role).forEach(f => {
        if (f.type === 'yn'){ const v = state.values[f.id] || ''; if (!v) errors.push([f.id, 'Выбери «Да» или «Нет»']); out[f.id] = v; return; }
        if (f.dep && state.values[f.dep] !== 'yes'){ out[f.id] = null; return; }
        const raw = $('#'+f.id).value.trim(), n = parseNum(raw);
        if (raw === '')  return errors.push([f.id, 'Заполни поле']);
        if (isNaN(n))    return errors.push([f.id, 'Нужно число, например 95 или 95,5']);
        if (n < 0)       return errors.push([f.id, 'Не может быть меньше нуля']);
        if (f.positive && n <= 0) return errors.push([f.id, 'Должно быть больше нуля']);
        if (f.type === 'step'){
          if (n < f.min || n > f.max) return errors.push([f.id, `От ${fmtNum(f.min, f.min % 1 ? 1 : 0)} до ${fmtNum(f.max)}`]);
          if (f.int && n % 1) return errors.push([f.id, 'Только целое число']);
        }
        out[f.id] = n;
      });
      return { values: out, errors };
    }

    /* ================= ФОРМУЛЫ (не менялись) ================= */
    const CALC = {
      zam(v){
        const to=v.zam_to, tp=v.zam_tp, ato=v.zam_ato, hr=v.zam_hr, feedback=v.zam_feedback;
        const bonusTO = to >= 95 && to < 98 ? 5000 : to >= 98 && to <= 102.9 ? 10000 : to > 102.9 ? 15000 : 0;
        const bonusTP = tp >= 85 && tp < 90 ? 1500 : tp >= 90 ? 3000 : 0;
        const bonusATO = ato >= 85 && ato <= 95 ? 1500 : ato > 95 ? 3000 : 0;
        const bonusHR = hr >= 80 && hr <= 85 ? 2000 : hr > 85 ? 4000 : 0;
        const bonusFeedback = feedback > 3 && feedback < 6 ? 1500 : feedback <= 3 ? 3000 : 0;
        const total = bonusTO + bonusTP + bonusATO + bonusHR + bonusFeedback;
        return {
          totalLabel:'Общая премия за месяц', total, totalText:rub(total),
          sub:'Сумма всех премий по KPI',
          sections:[{ title:'Расчёт премий', rows:[
            { label:`Премия за ТО (${pct(to)})`, note: to >= 95 && to < 98 ? '≥ 95% и < 98% → 5 000 ₽' : to >= 98 && to <= 102.9 ? '≥ 98% и ≤ 102,9% → 10 000 ₽' : to > 102.9 ? '> 102,9% → 15 000 ₽' : '< 95% → 0 ₽', value:bonusTO, text:rub(bonusTO) },
            { label:`Тайный покупатель (${pct(tp)})`, note: tp >= 85 && tp < 90 ? '≥ 85% и < 90% → 1 500 ₽' : tp >= 90 ? '≥ 90% → 3 000 ₽' : '< 85% → 0 ₽', value:bonusTP, text:rub(bonusTP) },
            { label:`АТО+СГИ (${pct(ato)})`, note: ato >= 85 && ato <= 95 ? '≥ 85% и ≤ 95% → 1 500 ₽' : ato > 95 ? '> 95% → 3 000 ₽' : '< 85% → 0 ₽', value:bonusATO, text:rub(bonusATO) },
            { label:`HR-индекс (${pct(hr)})`, note: hr >= 80 && hr <= 85 ? '≥ 80% и ≤ 85% → 2 000 ₽' : hr > 85 ? '> 85% → 4 000 ₽' : '< 80% → 0 ₽', value:bonusHR, text:rub(bonusHR) },
            { label:`Отзывы (${fmtNum(feedback, feedback % 1 ? 1 : 0)} на 10 000 чеков)`, note: feedback > 3 && feedback < 6 ? '> 3 и < 6 → 1 500 ₽' : feedback <= 3 ? '≤ 3 → 3 000 ₽' : '≥ 6 → 0 ₽', value:bonusFeedback, text:rub(bonusFeedback) }
          ]}]
        };
      },
      povar(v){
        const baseRate=v.baseRate, to=v.to, hours=v.hours;
        const checklist = v.povar_has_checklist === 'yes' ? v.checklist : 0;
        const ovk = v.povar_has_ovk === 'yes' ? v.ovk : 0;
        const ato = v.povar_has_ato === 'yes' ? v.ato : 0;
        const bonusTO = to >= 95 && to <= 98 ? 10 : to > 98 ? 15 : 0;
        const bonusChecklist = checklist > 95 ? 15 : 0;
        const bonusOVK = ovk >= 100 ? 25 : 0;
        const bonusATO = ato >= 85 && ato <= 95 ? 15 : ato > 95 ? 25 : 0;
        const perHour = bonusTO + bonusChecklist + bonusOVK + bonusATO;
        const totalRate = baseRate + perHour;
        const total = totalRate * hours;
        const chk = (has, val) => has === 'yes' ? pct(val) : 'не было';
        return {
          totalLabel:'Зарплата за смену', total, totalText:rub(total),
          sub:`${rubH(totalRate)} × ${h1(hours)}`,
          sections:[
            { title:'Надбавки за час', rows:[
              { label:`За ТО (${pct(to)})`, note: to >= 95 && to <= 98 ? '≥ 95% и ≤ 98% → 10 ₽/час' : to > 98 ? '> 98% → 15 ₽/час' : '< 95% → 0 ₽/час', value:bonusTO, text:rubH(bonusTO) },
              { label:`За чек-лист (${chk(v.povar_has_checklist, checklist)})`, note: checklist > 95 ? '> 95% → 15 ₽/час' : '≤ 95% или проверки не было → 0 ₽/час', value:bonusChecklist, text:rubH(bonusChecklist) },
              { label:`За ОВК (${chk(v.povar_has_ovk, ovk)})`, note: ovk >= 100 ? '= 100% → 25 ₽/час' : '< 100% или проверки не было → 0 ₽/час', value:bonusOVK, text:rubH(bonusOVK) },
              { label:`За АТО+СГИ (${chk(v.povar_has_ato, ato)})`, note: ato >= 85 && ato <= 95 ? '≥ 85% и ≤ 95% → 15 ₽/час' : ato > 95 ? '> 95% → 25 ₽/час' : '< 85% или проверки не было → 0 ₽/час', value:bonusATO, text:rubH(bonusATO) }
            ]},
            { title:'Итог', rows:[
              { label:'Базовая ставка', text:rubH(baseRate) },
              { label:'Итоговая надбавка за час', value:perHour, text:'+ ' + rubH(perHour), plus:true },
              { label:'Итоговая ставка за час', text:rubH(totalRate) },
              { label:`Зарплата за смену (${h1(hours)})`, text:rub(total), total:true }
            ]}
          ]
        };
      },
      others(v){
        const TO=v.others_to, TO_percent=v.others_to_percent, hasTP=v.others_has_tp, hasATO=v.others_has_ato;
        const TP = hasTP === 'yes' ? v.others_tp : 0;
        const ATO = hasATO === 'yes' ? v.others_ato : 0;
        const complaints = parseInt(v.others_complaints);
        const hourlyRate=v.others_hourly_rate, shiftLength=v.others_shift_length, totalHours=v.others_total_hours;

        let coefTP = 1;
        if (hasTP === 'yes'){ if (TP < 80) coefTP = 0.5; else if (TP >= 80 && TP < 95) coefTP = 1; else if (TP >= 95) coefTP = 2; }
        const coefComplaints = complaints === 0 ? 1 : 0.75;
        let coefATO = 1;
        if (hasATO === 'yes'){ if (ATO < 85) coefATO = 0.5; else if (ATO >= 85 && ATO <= 95) coefATO = 1; else if (ATO > 95) coefATO = 2; }

        const fundTO = TO_percent <= 100 ? 0.009 * TO : 0.018 * TO;
        const fund = fundTO * coefTP * coefComplaints * coefATO;
        const salaryBase = hourlyRate * shiftLength;
        const personalBonus = (fund / totalHours) * shiftLength;
        const total = salaryBase + personalBonus;
        const k = n => '× ' + fmtNum(n, 2);
        return {
          totalLabel:'Зарплата за смену', total, totalText:rub(total),
          sub:`База ${rub(salaryBase)} + премия ${rub(personalBonus)}`,
          sections:[
            { title:'Фонд премии лавки', rows:[
              { label:`Базовый фонд от ТО (${pct(TO_percent)})`, note: TO_percent <= 100 ? 'План ≤ 100% → 0,9% от ТО' : 'План > 100% → 1,8% от ТО', text:rub(fundTO) },
              { label:`Коэф. Тайного покупателя (${hasTP === 'yes' ? pct(TP) : 'не было'})`, text:k(coefTP) },
              { label:`Коэф. жалоб (${complaints})`, text:k(coefComplaints) },
              { label:`Коэф. АТО+СГИ (${hasATO === 'yes' ? pct(ATO) : 'не было'})`, text:k(coefATO) },
              { label:'Итоговый фонд', text:rub(fund), total:true }
            ]},
            { title:'Твоя зарплата', rows:[
              { label:`База за смену (${h1(shiftLength)})`, text:rub(salaryBase) },
              { label:'Доля из фонда', note:`Фонд ÷ ${fmtNum(totalHours, totalHours % 1 ? 1 : 0)} ч команды × ${h1(shiftLength)}`, value:personalBonus, text:'+ ' + rub(personalBonus), plus:true }
            ]}
          ]
        };
      },
      general(v){
        const hourlyRate=v.general_rate, shifts=parseInt(v.general_shifts), hours=v.general_hours;
        const total = hourlyRate * shifts * hours;
        return {
          totalLabel:'Зарплата за месяц', total, totalText:rub(total),
          sub:`${fmtNum(shifts)} дн × ${h1(hours)} × ${rubH(hourlyRate)}`,
          sections:[{ title:'Параметры', rows:[
            { label:'Часовая ставка', text:rubH(hourlyRate) },
            { label:'Количество смен', text:fmtNum(shifts) },
            { label:'Длительность смены', text:h1(hours) },
            { label:'Всего часов', text:fmtNum(shifts * hours, (shifts*hours) % 1 ? 1 : 0) + ' ч' }
          ]}]
        };
      }
    };


    /* ================= ЧЕК ================= */
    const head = sub => `<div class="rc-c rc-title">РАСЧЁТ ЗАРПЛАТЫ</div><div class="rc-c rc-m">${esc(sub)}</div>`;
    function showEmpty(err){
      const r = $('#receipt'); r.classList.remove('print');
      const roleLine = state.role ? `<div class="rc-row"><span class="l rc-m">Должность</span></div><div>${esc(ROLES[state.role].name)}</div><hr class="rc-cut">` : '';
      r.innerHTML = head(new Date().toLocaleDateString('ru-RU')) + '<hr class="rc-cut">' + roleLine
        + (err ? `<div class="rc-c rc-empty"><div class="rc-err">НЕ ХВАТАЕТ ДАННЫХ</div>${esc(err)}</div>`
               : `<div class="rc-c rc-empty">${state.role ? 'Заполни поля и нажми<br>«Рассчитать»' : 'Выбери должность,<br>и здесь появится расчёт'}</div>`);
      $('#sideActions').hidden = true;
    }
    function renderReceipt(r){
      const el = $('#receipt');
      const now = new Date().toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      const rows = rs => rs.map(x => `<div class="rc-row${x.total ? ' b' : ''}"><span class="l">${esc(x.label)}</span><span class="d"></span><span class="v">${esc(x.text)}</span></div>${x.note ? `<div class="rc-note">${esc(x.note)}</div>` : ''}`).join('');
      el.innerHTML = head(now) + '<hr class="rc-cut">'
        + `<div class="rc-m">Должность</div><div>${esc(ROLES[state.role].name)}</div><hr class="rc-cut">`
        + r.sections.map(s => `<div class="rc-sec">${esc(s.title.toUpperCase())}</div>${rows(s.rows)}`).join('<hr class="rc-cut">')
        + `<hr class="rc-dbl"><div class="rc-sec">ИТОГО: ${esc(r.totalLabel.toLowerCase())}</div><div class="rc-total"><span class="rc-m">${esc(r.sub)}</span><span class="v">${esc(r.totalText)}</span></div><hr class="rc-dbl">`;
      el.classList.remove('print'); void el.offsetWidth; el.classList.add('print');
      $('#sideActions').hidden = false;
    }

    function calculate(){
      if (!state.role){ toast('Сначала выбери должность'); return; }
      $$('.row.invalid').forEach(el => el.classList.remove('invalid'));
      const { values, errors } = collect();
      if (errors.length){
        errors.forEach(([id, m]) => setErr(id, m));
        state.last = null;
        showEmpty(errors.length === 1 ? 'Заполни отмеченное поле' : `Заполни отмеченные поля: ${errors.length}`);
        const first = $(`.row[data-id="${errors[0][0]}"]`);
        scrollTo({ top: first.getBoundingClientRect().top + scrollY - 24, behavior:'smooth' });
        const inp = $('input', first); if (inp) setTimeout(() => inp.focus({ preventScroll:true }), 350);
        return;
      }
      const r = CALC[state.role](values);
      state.last = { values, result:r };
      renderReceipt(r);
      if (window.innerWidth <= 960) scrollTo({ top: $('#side').getBoundingClientRect().top + scrollY - 16, behavior:'smooth' });
    }

    /* ================= КОПИРОВАНИЕ ================= */
    function copyText(){
      if (!state.last) return '';
      const { values, result } = state.last;
      const lines = [`Должность: ${ROLES[state.role].name}`, 'Введённые данные:'];
      fieldsOf(state.role).forEach(f => {
        const v = values[f.id];
        if (v === null || v === undefined || v === '') return;
        lines.push(`${f.copy}: ${f.type === 'yn' ? (v === 'yes' ? 'Да' : 'Нет/Не знаю') : f.hours ? fmtNum(v, 1) : fmtNum(v, v % 1 ? 2 : 0)}`);
      });
      lines.push('', 'Результат расчёта:');
      result.sections.forEach(s => { lines.push(s.title); s.rows.forEach(x => lines.push(`  ${x.label}: ${x.text}${x.note ? ` (${x.note})` : ''}`)); });
      lines.push('', `${result.totalLabel}: ${result.totalText}`);
      return lines.join('\n') + '\n';
    }
    async function copyData(){
      const text = copyText(); if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
        toast('Расчёт скопирован');
      } catch(e){ toast('Не получилось скопировать. Выдели текст чека вручную'); }
    }
    let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

    /* ================= СОБЫТИЯ ================= */
    $('#roles').addEventListener('click', e => { const b = e.target.closest('.role'); if (b) selectRole(b.dataset.role); });
    $('#roles').addEventListener('keydown', e => {
      const k = e.key; if (!['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(k)) return;
      e.preventDefault(); const l = $$('.role'), i = l.indexOf(document.activeElement);
      const n = l[(i + (k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1) + l.length) % l.length]; n.focus(); selectRole(n.dataset.role);
    });
    $('#form').addEventListener('click', e => {
      const q = e.target.closest('.q');
      if (q){ const h = $('#' + q.getAttribute('aria-controls')); h.hidden = !h.hidden; q.setAttribute('aria-expanded', String(!h.hidden)); return; }
      const yn = e.target.closest('.seg button'); if (yn){ setYN(yn.closest('.seg').dataset.yn, yn.dataset.v); return; }
      const sb = e.target.closest('.stepper button'); if (sb){ stepValue(sb.closest('.row').dataset.id, Number(sb.dataset.inc)); return; }
      const p = e.target.closest('.presets button'); if (p){ setStepVal(p.closest('.row').dataset.id, p.dataset.preset); }
    });
    $('#form').addEventListener('input', e => {
      const inp = e.target; if (inp.tagName !== 'INPUT') return;
      inp.value = inp.value.replace(/[^\d.,]/g, '');
      clearErr(inp.id);
      if (fieldDef(inp.id)?.type === 'step'){ fitInput(inp); syncPresets(inp.id); }
    });
    $('#form').addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); calculate(); }
      if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && e.target.tagName === 'INPUT'){
        const f = fieldDef(e.target.id); if (f && f.type === 'step'){ e.preventDefault(); stepValue(f.id, e.key === 'ArrowUp' ? 1 : -1); }
      }
    });
    $('#form').addEventListener('submit', e => { e.preventDefault(); calculate(); });
    $('#calcBtn').addEventListener('click', calculate);
    $('#calcBtnM').addEventListener('click', calculate);
    $('#copyBtn').addEventListener('click', copyData);
    $('#resetBtn').addEventListener('click', () => { selectRole(state.role, true); toast('Поля очищены'); });

    // мобильная панель «Рассчитать»: когда основная кнопка и чек вне экрана
    const vis = { calc:false, side:false };
    function updateBar(){ $('#mbar').classList.toggle('show', !!state.role && !vis.calc && !vis.side); }
    new IntersectionObserver(([en]) => { vis.calc = en.isIntersecting; updateBar(); }).observe($('#calcBtn'));
    new IntersectionObserver(([en]) => { vis.side = en.isIntersecting; updateBar(); }).observe($('#side'));

    showEmpty();
    window.__calc = { CALC, ROLES };
  })();
  </script>
</body>
</html>
